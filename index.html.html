<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>드론 티타늄 합금 가상 실험</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f7fb;color:#172033;font-family:Arial,"Noto Sans KR",sans-serif}
.wrap{max-width:900px;margin:auto;padding:20px}
.card{background:#fff;border-radius:18px;padding:22px;margin-bottom:18px;box-shadow:0 4px 16px rgba(0,0,0,.08)}
h1{margin:0 0 8px}h2{margin:0 0 15px}
.desc{color:#667085;font-size:14px;line-height:1.6}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
label{font-weight:bold;display:block;margin-bottom:7px}
input{width:100%;padding:13px;border:1px solid #ccd3df;border-radius:10px;font-size:16px}
button{border:0;border-radius:10px;padding:13px 17px;margin:10px 6px 0 0;font-size:15px;font-weight:bold;cursor:pointer}
.primary{background:#172033;color:white}.secondary{background:#e8edf5;color:#172033}
.selected{margin-top:18px;display:flex;flex-wrap:wrap;gap:8px}
.tag{background:#eef2f7;border-radius:999px;padding:8px 12px;font-size:14px}
.result{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:15px}
.metric{background:#f2f5f8;padding:18px;border-radius:14px}
.metric small{color:#667085}.metric strong{display:block;font-size:24px;margin-top:7px}
table{width:100%;border-collapse:collapse;margin-top:12px}
th,td{padding:11px;text-align:center;border-bottom:1px solid #e1e5eb}
th{background:#eef2f6}
.msg{margin-top:12px;color:#667085;font-size:14px}
.empty{color:#667085;padding:10px 0}
@media(max-width:650px){.grid,.result{grid-template-columns:1fr}.wrap{padding:12px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>드론 티타늄 합금 가상 실험</h1>
    <p class="desc">
      기본 프레임 무게를 입력한 뒤, 비교하고 싶은 티타늄 합금 비율을 하나씩 입력하세요.
      여러 조건을 추가한 후 <b>비교하기</b>를 누르면 선택한 조건만 비교됩니다.
    </p>

    <div class="grid">
      <div>
        <label for="baseWeight">기본 프레임 무게 (g)</label>
        <input id="baseWeight" type="number" min="1" step="1" value="500">
      </div>
      <div>
        <label for="ratio">티타늄 합금 비율 (%)</label>
        <input id="ratio" type="number" min="0" max="100" step="1" value="0">
      </div>
    </div>

    <button class="primary" id="addBtn" type="button">실험 결과 추가</button>
    <button class="secondary" id="compareBtn" type="button">비교하기</button>
    <button class="secondary" id="clearBtn" type="button">전체 초기화</button>

    <div id="selected" class="selected"></div>
    <div id="msg" class="msg" aria-live="polite"></div>
  </div>

  <div class="card">
    <h2>현재 입력값의 실험 결과</h2>
    <div class="result">
      <div class="metric"><small>티타늄 합금 비율</small><strong id="currentRatio">-</strong></div>
      <div class="metric"><small>예상 프레임 무게</small><strong id="currentWeight">-</strong></div>
      <div class="metric"><small>상대적 비행 효율</small><strong id="currentEfficiency">-</strong></div>
      <div class="metric"><small>기본 무게 대비 변화</small><strong id="currentChange">-</strong></div>
    </div>
  </div>

  <div class="card">
    <h2>선택한 조건 비교</h2>
    <div id="comparison" class="empty">비교할 조건을 추가한 뒤 「비교하기」를 눌러주세요.</div>
  </div>

  <div class="card">
    <p class="desc">
      ※ 교육용 가상 실험 모델입니다. 실제 드론의 비행 성능을 예측하는 공학용 시뮬레이터는 아닙니다.
    </p>
  </div>
</div>

<script>
(function(){
  const selectedRatios = new Set();

  const baseInput = document.getElementById("baseWeight");
  const ratioInput = document.getElementById("ratio");
  const selectedEl = document.getElementById("selected");
  const msgEl = document.getElementById("msg");
  const comparisonEl = document.getElementById("comparison");

  function validate(){
    const base = Number(baseInput.value);
    const ratio = Number(ratioInput.value);

    if(!Number.isFinite(base) || base <= 0){
      throw new Error("기본 프레임 무게를 1g 이상 입력하세요.");
    }
    if(!Number.isFinite(ratio) || ratio < 0 || ratio > 100){
      throw new Error("티타늄 합금 비율은 0~100%로 입력하세요.");
    }
    return {base, ratio};
  }

  function calculate(base, ratio){
    const factor = 1 + 0.12 * (ratio / 100);
    return {
      weight: base * factor,
      efficiency: 100 / factor
    };
  }

  function showCurrent(){
    const {base, ratio} = validate();
    const r = calculate(base, ratio);

    document.getElementById("currentRatio").textContent = ratio + "%";
    document.getElementById("currentWeight").textContent = r.weight.toFixed(1) + " g";
    document.getElementById("currentEfficiency").textContent = r.efficiency.toFixed(1) + "%";
    document.getElementById("currentChange").textContent =
      (r.weight - base >= 0 ? "+" : "") + (r.weight - base).toFixed(1) + " g";
  }

  function renderSelected(){
    if(selectedRatios.size === 0){
      selectedEl.innerHTML = "";
      return;
    }

    selectedEl.innerHTML =
      "<strong style='width:100%;font-size:14px'>비교할 조건:</strong>" +
      [...selectedRatios].sort((a,b)=>a-b)
      .map(r => `<span class="tag">${r}%</span>`).join("");
  }

  function addExperiment(){
    try{
      const {ratio} = validate();
      showCurrent();

      if(selectedRatios.has(ratio)){
        msgEl.textContent = ratio + "%는 이미 추가되어 있습니다.";
        return;
      }

      selectedRatios.add(ratio);
      renderSelected();
      msgEl.textContent = ratio + "% 조건의 결과를 비교 목록에 추가했습니다.";
    }catch(e){
      msgEl.textContent = e.message;
    }
  }

  function compare(){
    try{
      const {base} = validate();

      if(selectedRatios.size < 2){
        comparisonEl.innerHTML =
          "<div class='empty'>비교하려면 서로 다른 조건을 2개 이상 추가해주세요.</div>";
        msgEl.textContent = "비교할 조건을 2개 이상 추가하세요.";
        return;
      }

      const ratios = [...selectedRatios].sort((a,b)=>a-b);

      let html = "<table><thead><tr>" +
        "<th>티타늄 합금 비율</th>" +
        "<th>예상 프레임 무게</th>" +
        "<th>상대적 비행 효율</th>" +
        "<th>무게 변화</th>" +
        "</tr></thead><tbody>";

      ratios.forEach(ratio => {
        const r = calculate(base, ratio);
        const change = r.weight - base;
        html += `<tr>
          <td>${ratio}%</td>
          <td>${r.weight.toFixed(1)} g</td>
          <td>${r.efficiency.toFixed(1)}%</td>
          <td>${change >= 0 ? "+" : ""}${change.toFixed(1)} g</td>
        </tr>`;
      });

      html += "</tbody></table>";
      comparisonEl.innerHTML = html;
      msgEl.textContent = "선택한 조건끼리 비교했습니다.";
    }catch(e){
      msgEl.textContent = e.message;
    }
  }

  function clearAll(){
    selectedRatios.clear();
    renderSelected();
    comparisonEl.innerHTML =
      "<div class='empty'>비교할 조건을 추가한 뒤 「비교하기」를 눌러주세요.</div>";
    document.getElementById("currentRatio").textContent = "-";
    document.getElementById("currentWeight").textContent = "-";
    document.getElementById("currentEfficiency").textContent = "-";
    document.getElementById("currentChange").textContent = "-";
    msgEl.textContent = "";
  }

  document.getElementById("addBtn").addEventListener("click", addExperiment);
  document.getElementById("compareBtn").addEventListener("click", compare);
  document.getElementById("clearBtn").addEventListener("click", clearAll);

  ratioInput.addEventListener("input", function(){
    try{
      showCurrent();
      msgEl.textContent = "";
    }catch(e){
      msgEl.textContent = e.message;
    }
  });
})();
</script>
</body>
</html>
